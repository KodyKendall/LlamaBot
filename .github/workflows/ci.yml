# CI Workflow for Leonardo
# Runs lint + parallelized test suites on every push and pull request

name: Leonardo CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
