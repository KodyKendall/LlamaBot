# .github/workflows/ci.yml

name: LlamaBot CI Tests

# Controls when the action will run.
on:
  # Run on pushes to main AND the active dev branches (0.4.1-alpha etc.) —
  # development happens on *-alpha branches, so CI must run there, not just
  # on the (often stale) main branch.
  push:
    branches: [ "main", "*-alpha" ]
  # Run on PRs into main AND the active dev branches — PRs target *-alpha
  # during development, and without this they'd merge with no CI at all
  # (push-triggered CI only runs *after* the merge).
  pull_request:
    branches: [ "main", "*-alpha" ]

jobs:
  # This workflow contains a single job called "test"
  test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # These services are spun up as separate containers and are available
    # to the main job container on the same Docker network.
    # This replaces the `db` and `redis` services from your docker-compose.yml.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: llamapress_production
          POSTGRES_USER: postgres
          # Using 'trust' is insecure for production but simplifies CI.
          # It tells Postgres to allow any connection from its network without a password.
          POSTGRES_HOST_AUTH_METHOD: trust
        # Health check options to ensure postgres is ready before starting tests.
        # GitHub Actions uses 'options' instead of the 'healthcheck' key.
        options: >-
          --health-cmd "pg_isready -U postgres -d llamapress_production"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps port 5432 on the runner to port 5432 on the postgres container
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      # 1. Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Create Docker Compose override file for CI
      # This step ensures that we build the image from the Dockerfile in the repo
      # instead of pulling a potentially outdated one from Docker Hub.
      - name: Create Docker Compose override file for CI
        run: |
          cat <<EOF > docker-compose.ci.yml
          services:
            llamabot:
              build:
                context: .
                dockerfile: Dockerfile
          EOF
      
      # 3. Create .env file from GitHub Secrets
      # This securely injects your secrets into an .env file that docker-compose will use.
      - name: Create .env file
        run: |
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
          # Not a real key. Several clients (ChatDeepSeek among them) validate key
          # presence at CONSTRUCTION, so any test that walks a fallback path into
          # get_llm("deepseek-v4-flash") raises a pydantic ValidationError without
          # this — no network call is ever made. Same dud-key trick as release.yml's
          # boot smoke.
          echo "DEEPSEEK_API_KEY=ci-not-a-real-key" >> .env
          # No POSTGRES_PASSWORD needed now. The DB_URI points to the 'postgres' service container.
          echo "DB_URI=postgresql://postgres@postgres:5432/llamapress_production" >> .env
          echo "LANGCHAIN_TRACING_V2=false" >> .env
          # Add any other required environment variables here

      # 4. Build the Docker image using docker-compose
      # This command starts the llamabot service and its dependencies,
      # runs the test script, and then exits.
      - name: Build the llamabot service
        # Use both the original and the CI override file. The 'build' context from
        # the CI file will override the 'image' from the main file.
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build llamabot

      # 5. Run the tests
      # This command starts the llamabot service and its dependencies,
      # runs the test script, and then exits.
      - name: Run Pytest suite
        env:
          POSTGRES_HOST_AUTH_METHOD: trust   # ✅ ensures db container becomes healthy
          POSTGRES_PASSWORD: postgres     # set password for db container
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up --wait db
          docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm llamabot python run_tests.py all

  # Full-stack e2e against the real Leonardo composition: builds the llamabot
  # image from THIS commit, drops it into Leonardo's docker-compose stack
  # (pinned llamapress image), and drives a real browser through login →
  # WebSocket → agent round-trip using the deterministic fake-llm model.
  # Catches chat-UI/WS/agent-routing regressions that unit tests can't see.
  e2e:
    name: E2E vs Leonardo stack (mock LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout LlamaBot (this commit)
        uses: actions/checkout@v4

      - name: Build llamabot image from this commit
        run: docker build -t llamabot:ci-e2e .

      - name: Checkout Leonardo (e2e harness + stack definition)
        uses: actions/checkout@v4
        with:
          repository: KodyKendall/Leonardo
          path: leonardo

      - name: Configure Leonardo stack to use this commit's image
        working-directory: leonardo
        run: |
          cat > docker-compose.ci-llamabot.yml <<'OVERRIDE'
          services:
            llamabot:
              image: llamabot:ci-e2e
          OVERRIDE
          cp .env.example .env
          sed -i 's/^LANGSMITH_TRACING=.*/LANGSMITH_TRACING=false/' .env
          sed -i 's/^LLAMABOT_ENABLE_FAKE_LLM=.*/LLAMABOT_ENABLE_FAKE_LLM=true/' .env
          # docker-compose.yml bind-mounts ./.leonardo/instance.json into the
          # rails container (read by leonardo_instance.rb) and ./.leonardo into
          # llamabot. On a fresh Leonardo checkout that file does not exist, so
          # Docker auto-creates the mount source as a *directory* - which crashes
          # both the rails initializer (Errno::EISDIR) and llamabot's config
          # loader. Materialize a real, minimal JSON file so the mount is a file.
          mkdir -p .leonardo
          rm -rf .leonardo/instance.json
          echo '{}' > .leonardo/instance.json

      - name: Start database and create llamabot auth DB
        working-directory: leonardo
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci-llamabot.yml up -d --wait db redis
          docker compose -f docker-compose.yml -f docker-compose.ci-llamabot.yml exec -T db \
            psql -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='llamabot_production'" | grep -q 1 || \
          docker compose -f docker-compose.yml -f docker-compose.ci-llamabot.yml exec -T db \
            psql -U postgres -c "CREATE DATABASE llamabot_production"

      - name: Start the stack
        working-directory: leonardo
        run: docker compose -f docker-compose.yml -f docker-compose.ci-llamabot.yml up -d llamapress llamabot

      - name: Wait for chat UI (llamabot) and Rails (llamapress)
        working-directory: leonardo
        run: |
          for i in $(seq 1 60); do
            bot=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/login || true)
            rails=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/up || true)
            echo "attempt $i: llamabot /login -> ${bot:-none}, rails /up -> ${rails:-none}"
            # /login is 200 once users exist, 302 (-> /register) on a fresh
            # instance - both mean the app is up.
            case "$bot" in 200|302) if [ "$rails" = "200" ]; then exit 0; fi ;; esac
            sleep 5
          done
          echo "::error::Stack did not become healthy"
          docker compose -f docker-compose.yml -f docker-compose.ci-llamabot.yml logs llamabot | tail -100
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: leonardo/e2e/package-lock.json

      - name: Install Playwright
        working-directory: leonardo/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run e2e smoke + mock-LLM tests
        working-directory: leonardo/e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_COMPOSE_FILE: docker-compose.yml:docker-compose.ci-llamabot.yml
          E2E_MOCK_LLM: 'true'
        run: npx playwright test tests/smoke.spec.ts tests/mock-llm.spec.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e
          path: leonardo/e2e/playwright-report/
          retention-days: 7

      - name: Container logs on failure
        if: failure()
        working-directory: leonardo
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci-llamabot.yml logs llamabot | tail -200
          docker compose -f docker-compose.yml -f docker-compose.ci-llamabot.yml logs llamapress | tail -60
