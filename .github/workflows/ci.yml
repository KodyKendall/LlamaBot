  #       continue-on-error: true
  #       run: |
  #         cd /rails
  #         bundle exec erb_lint --lint-all

  # ─── Unit Specs: Models (heaviest unit bucket) ──────────
  unit-models:
    name: Unit Specs (Models)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: llamapress_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    container:
      image: kody06/llamapress-simple:0.4.0b
      env:
        RAILS_ENV: test
        DB_HOST: postgres
        POSTGRES_PASSWORD: password
    steps:
      - uses: actions/checkout@v4

      - name: Copy overlay files
        run: |
          cp -r rails/app/* /rails/app/
          cp -r rails/db/* /rails/db/
          cp -r rails/spec /rails/
          cp rails/config/routes.rb /rails/config/routes.rb
          cp rails/config/database.yml /rails/config/database.yml

      - name: Setup database
        run: |
          cd /rails
          bundle exec rails db:create db:schema:load db:seed

      - name: Run model specs
        run: |
          cd /rails
          bundle exec rspec spec/models --format documentation

  # ─── Request Specs (sharded across 2 runners) ──────────
  request-specs:
    name: Request Specs (Shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: llamapress_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    container:
      image: kody06/llamapress-simple:0.4.0b
      env:
        RAILS_ENV: test
        DB_HOST: postgres
        POSTGRES_PASSWORD: password
    steps:
      - uses: actions/checkout@v4

      - name: Copy overlay files
        run: |
          cp -r rails/app/* /rails/app/
          cp -r rails/db/* /rails/db/
          cp -r rails/spec /rails/
          cp rails/config/routes.rb /rails/config/routes.rb
          cp rails/config/database.yml /rails/config/database.yml

      - name: Setup database
        run: |
          cd /rails
          bundle exec rails db:create db:schema:load db:seed

      - name: Run request specs (shard ${{ matrix.shard }})
        run: |
          cd /rails
          files=$(find spec/requests -name '*_spec.rb' | sort | awk "NR % 2 == ${{ matrix.shard }}")
          echo "Running shard ${{ matrix.shard }} with $(echo "$files" | wc -l) files"
          bundle exec rspec $files --format documentation

  # ─── Browser Specs (Capybara/Cuprite) ───────────────────
  browser-specs:
    name: Browser Specs (System + Feature)
    runs-on: ubuntu-latest
    continue-on-error: true  # Temporary quarantine — remove once browser specs are stabilized
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: llamapress_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    container:
      image: kody06/llamapress-simple:0.4.0b
      env:
        RAILS_ENV: test
        DB_HOST: postgres
        POSTGRES_PASSWORD: password
    steps:
      - uses: actions/checkout@v4

      - name: Copy overlay files
        run: |
          cp -r rails/app/* /rails/app/
          cp -r rails/db/* /rails/db/
          cp -r rails/spec /rails/
          cp rails/config/routes.rb /rails/config/routes.rb
          cp rails/config/database.yml /rails/config/database.yml

      - name: Setup database
        run: |
          cd /rails
          bundle exec rails db:create db:schema:load db:seed

      - name: Run browser specs
        run: |
          cd /rails
          bundle exec rspec spec/system spec/features --format documentation
