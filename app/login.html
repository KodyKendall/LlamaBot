<!DOCTYPE html>
<html>
<head>
    <title>Leonardo</title>
    <link rel="icon" type="image/png" href="/frontend/leonardo-icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0d0d1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        .logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 32px;
        }
        .logo img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid rgba(139, 92, 246, 0.4);
            box-shadow: 0 0 24px rgba(139, 92, 246, 0.15);
            margin-bottom: 16px;
        }
        .logo h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #e0e0e0;
        }
        .card {
            background: #1a1730;
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 6px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 8px;
            background: #0d0d1a;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: rgba(139, 92, 246, 0.4);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.08);
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #8b5cf6 0%, #a78bfa 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 500;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .message {
            margin-top: 16px;
            padding: 10px 14px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9rem;
        }
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #ef4444;
        }
        /* Unified Login CTA — "Sign in with your LlamaPress.ai account". Only
           rendered on mothership-managed instances (see app/routers/ui.py). */
        .sso-cta {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #8b5cf6 0%, #a78bfa 100%);
            color: white;
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            box-sizing: border-box;
            transition: opacity 0.2s;
        }
        .sso-cta:hover { opacity: 0.9; }
        .sso-divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: rgba(255, 255, 255, 0.35);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }
        .sso-divider::before, .sso-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(139, 92, 246, 0.2);
        }
        .sso-divider span { padding: 0 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="https://llamapress-ai-image-uploads.s3.us-west-2.amazonaws.com/4bmqe5iolvp84ceyk9ttz8vylrym" alt="Leonardo">
            <h2>Leonardo</h2>
        </div>
        <div class="card">
            <!--SSO_CTA-->
            <form id="loginForm" autocomplete="on">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required autofocus>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>

                <button type="submit" id="submitBtn">Sign In</button>
            </form>
            <div id="message"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const btn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true;
            messageDiv.textContent = '';
            messageDiv.className = '';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'include',
                    body: JSON.stringify({username, password})
                });

                if (response.ok) {
                    window.location.href = '/';
                    return;
                }
                if (response.status === 401) {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = 'Invalid username or password.';
                } else {
                    let detail = 'Sign in failed.';
                    try {
                        const data = await response.json();
                        if (data && data.detail) detail = data.detail;
                    } catch (_) {}
                    messageDiv.className = 'message error';
                    messageDiv.textContent = detail;
                }
            } catch (err) {
                messageDiv.className = 'message error';
                messageDiv.textContent = 'Network error: ' + err.message;
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
